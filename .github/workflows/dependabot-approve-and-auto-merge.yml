name: Auto-Approve and Auto-Merge Bot PRs
# SECURITY: This workflow uses pull_request_target, so it runs in the BASE repo
# context with access to secrets even for fork PRs. Invariants (do not break):
#   1. NEVER check out or execute PR-head code (no actions/checkout of
#      github.event.pull_request.head.*, no building/running PR content).
#   2. NEVER interpolate untrusted PR fields (title, body, branch name) directly
#      into run: blocks - pass them through env: instead.
# See: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# Approval token decision (issue #1271, decided by the maintainer on 2026-10-11):
# approvals use the GH_ACTIONS_PR_WRITE PAT, not GITHUB_TOKEN. The repository
# setting "Allow GitHub Actions to create and approve pull requests" is off,
# so GITHUB_TOKEN cannot approve. The main ruleset needs one approval, so the
# PAT approval satisfies it. This is acceptable because the PAT only approves
# non-major updates, and Renovate holds NuGet updates for a 14-day cooldown.
on:
  pull_request_target:
    # labeled lets the Renovate job re-check after Renovate applies its labels.
    types: [opened, synchronize, reopened, labeled]

permissions: {}

jobs:
  dependabot:
    name: Dependabot (GitHub Actions)
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04-arm
    if: >-
      github.event.action != 'labeled' &&
      (github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]')
    steps:
      - name: Fetch metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GH_ACTIONS_PR_WRITE }}"

      - name: Approve PR
        if: steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PR_WRITE }}

      - name: Enable auto-merge for non-major updates
        if: steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PR_WRITE }}

  renovate:
    name: Renovate
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04-arm
    if: github.actor == 'renovate[bot]'
    steps:
      # Renovate handles auto-merge decisions via platformAutomerge and
      # per-package automerge rules in renovate.json. This workflow only
      # provides the required approval for non-major updates. Packages with
      # automerge: false (analyzer-compat, benchmark-tooling) will not have
      # auto-merge enabled by Renovate, so they require manual merge.
      #
      # Major updates carry the major-update label, which renovate.json adds.
      # Renovate opens the PR first and adds labels in a second API call, so
      # the opened event payload has no labels yet. The gate reads labels
      # from the API and fails closed: it approves only when the renovate
      # label is present (Renovate's label call has finished) and
      # major-update is absent. The labeled trigger re-runs the check once
      # Renovate adds its labels.
      #
      # Caveat: anyone with triage permission can remove labels. Removing
      # major-update from a major PR would let the next run approve it. In a
      # single-maintainer repository this is acceptable, and it is stronger
      # than the old PR title check, which Renovate's title format had
      # already broken.
      - name: Check update labels
        id: labels
        run: |
          labels="$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')"
          if grep -qxF 'renovate' <<< "$labels" && ! grep -qxF 'major-update' <<< "$labels"; then
            echo "approve=true" >> "$GITHUB_OUTPUT"
          else
            echo "approve=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Approve PR
        if: steps.labels.outputs.approve == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PR_WRITE }}
          PR_URL: ${{ github.event.pull_request.html_url }}
