# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Required check: report on merge queue groups too.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '32 8 * * 1'

permissions: {}

jobs:
  lint:
    name: DevSkim
    # DevSkim-Action is a Docker container action, which GitHub Actions
    # only supports on Linux x64 runners; do not use ARM64 runners.
    # https://docs.github.com/en/actions/creating-actions/about-custom-actions#docker-container-actions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221 # v1
        with:
          # Keep the action defaults (.git, bin). Also skip the perf baseline.
          # Its "sha" field is a git commit SHA, not a secret, and DS173237
          # flags it each time the baseline moves to a new commit.
          ignore-globs: "**/.git/**,**/bin/**,**/build/perf/baseline.json"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: devskim-results.sarif
