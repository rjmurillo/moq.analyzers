name: CLA Guard
# Required check that proves cla-assistant.io, not some other actor, posted the
# license/cla status. A commit status has no app identity, so a ruleset cannot
# pin license/cla to cla-assistant.io. This job runs as GitHub Actions, so the
# ruleset pins it to the github-actions app instead.
#
# cla-assistant.io posts license/cla with the repository owner's OAuth token,
# so its creator is always the owner. Any other creator means a spoofed status.
#
# A contributor who signs the CLA after this job fails must re-run the job.
#
# SECURITY: This workflow uses pull_request_target. It never checks out or runs
# PR code, and it passes PR fields through env: only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  verify:
    name: Verify CLA status
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      statuses: read
    steps:
      - name: Wait for license/cla from cla-assistant.io
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CREATOR: ${{ github.repository_owner }}
        run: |
          for attempt in $(seq 1 30); do
            result=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" \
              --jq '[.[] | select(.context == "license/cla")][0] // {} | "\(.state // "missing") \(.creator.login // "none")"')
            read -r state creator <<< "$result"
            if [ "$state" = "success" ]; then
              if [ "$creator" = "$EXPECTED_CREATOR" ]; then
                echo "license/cla is success, posted by $creator."
                exit 0
              fi
              echo "::error::license/cla success was posted by '$creator', expected '$EXPECTED_CREATOR' (cla-assistant.io)."
              exit 1
            fi
            echo "Attempt $attempt: license/cla is '$state'. Waiting 20 seconds."
            sleep 20
          done
          echo "::error::license/cla did not reach success. Sign the CLA at https://cla-assistant.io/$REPO, then re-run this job."
          exit 1
