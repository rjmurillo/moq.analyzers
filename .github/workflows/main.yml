name: Main build

on:
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Run performance job? (true/false)'
        required: false
        default: false
        type: boolean
      force_baseline:
        description: 'Force running baseline benchmarks even if cached (true/false)'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_call: # Allow to be called from the release workflow
  schedule:
    - cron: '0 3 * * *' # Nightly run for performance validation

permissions:
  packages: read
  contents: read
  actions: read

jobs:
  # Decide how much of the pipeline a pull request needs.
  # Required jobs below always run so every required check reports. They
  # skip their expensive steps when their run-* output is not 'true'.
  # The classifier in build/scripts/ci/classify-changed-paths.sh maps the
  # changed paths to one tier:
  #   docs-only     skip build, test, load tests, and perf
  #   docs-tested   build and pack, run only the tests that read docs
  #   full-no-perf  run everything except perf
  #   full          run everything
  #
  # This job must fail safe. A job whose dependency fails is skipped, and a
  # skipped required check does not block merge. So both steps continue on
  # error, and each run-* output is 'true' unless the classifier named a
  # tier that skips that work. Events other than pull_request run everything.
  check-paths:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    outputs:
      tier: ${{ github.event_name != 'pull_request' && 'full' || steps.classify.outputs.tier || 'full' }}
      run-build: ${{ github.event_name != 'pull_request' || steps.classify.outputs.tier != 'docs-only' }}
      run-docs-tests: ${{ github.event_name == 'pull_request' && steps.classify.outputs.tier == 'docs-tested' }}
      run-tests: >-
        ${{ github.event_name != 'pull_request'
        || (steps.classify.outputs.tier != 'docs-only'
        && steps.classify.outputs.tier != 'docs-tested') }}
      run-perf: >-
        ${{ github.event_name != 'pull_request'
        || (steps.classify.outputs.tier != 'docs-only'
        && steps.classify.outputs.tier != 'docs-tested'
        && steps.classify.outputs.tier != 'full-no-perf') }}
    steps:
      # The pull_request ref is a test merge commit. Depth 2 fetches its
      # first parent, which is the base branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # Use the base branch copy of the classifier, so a pull request
          # cannot lower its own tier. The build job tests the new copy.
          classifier="$RUNNER_TEMP/classify-changed-paths.sh"
          git show HEAD^1:build/scripts/ci/classify-changed-paths.sh > "$classifier"

          # --no-renames lists both sides of a rename, so moving a file out
          # of src/ still counts as a src/ change.
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          echo "Changed paths:"
          printf '%s\n' "$changed"
          result="$(printf '%s\n' "$changed" | bash "$classifier")"
          echo "Tier: $result"
          echo "tier=$result" >> "$GITHUB_OUTPUT"

  powershell-perf-tests:
    needs: check-paths
    if: needs.check-paths.outputs.run-perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Run perf module Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path build/scripts/perf/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  # Build, validate, and package. Fast gate (~5 min).
  # Tests, analyzer-load-test, and perf run as separate downstream jobs.
  build:
    needs: check-paths
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-paths.outputs.run-build == 'true'
        with:
          fetch-depth: 0

      # On a docs-only run, fetch only the classifier so its tests still run
      # and a broken tier list fails this required check.
      - name: Check out path classifier
        if: needs.check-paths.outputs.run-build != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build/scripts/ci
          persist-credentials: false

      - name: Test path classifier
        run: bash build/scripts/ci/classify-changed-paths.test.sh

      - name: Setup, Restore, and Build Solution
        if: needs.check-paths.outputs.run-build == 'true'
        uses: ./.github/actions/setup-restore-build

      - name: Detect unused NuGet dependencies
        if: needs.check-paths.outputs.run-build == 'true'
        shell: pwsh
        run: dotnet snitch --strict

      - name: Validate analyzer host compatibility
        if: needs.check-paths.outputs.run-build == 'true'
        shell: pwsh
        run: |
          # Verify shipped analyzer DLLs don't reference assembly versions
          # exceeding what the minimum supported SDK host (.NET 8) provides.
          # See: https://github.com/rjmurillo/moq.analyzers/issues/850
          $maxVersions = @{
            'System.Collections.Immutable' = [Version]'8.0.0.0'
            'System.Reflection.Metadata'   = [Version]'8.0.0.0'
          }
          $shippedDlls = @(
            'artifacts/bin/Moq.Analyzers/release/Moq.Analyzers.dll',
            'artifacts/bin/Moq.Analyzers/release/Moq.CodeFixes.dll',
            'artifacts/bin/Moq.Analyzers/release/Microsoft.CodeAnalysis.AnalyzerUtilities.dll'
          )
          $failed = $false
          foreach ($dll in $shippedDlls) {
            $name = [System.IO.Path]::GetFileName($dll)
            $bytes = [System.IO.File]::ReadAllBytes($dll)
            $asm = [System.Reflection.Assembly]::Load($bytes)
            $dllFailed = $false
            foreach ($ref in $asm.GetReferencedAssemblies()) {
              if ($maxVersions.ContainsKey($ref.Name) -and $ref.Version -gt $maxVersions[$ref.Name]) {
                Write-Error "$name references $($ref.Name) $($ref.Version), max allowed is $($maxVersions[$ref.Name])"
                $failed = $true
                $dllFailed = $true
              }
            }
            if (-not $dllFailed) { Write-Host "$name - OK" }
          }
          if ($failed) { exit 1 }

      # The docs-tested tier skips the test job, so run here the only tests
      # that read the changed docs. DiagnosticDescriptorMetadataTests reads
      # docs/rules. PackageTests checks the packed nupkg, which holds
      # README.md. This run omits the coverage runsettings on purpose: a
      # partial run must not produce coverage. The test job reports the
      # base commit's coverage to Codacy instead.
      - name: Test rule docs and package contents
        if: needs.check-paths.outputs.run-docs-tests == 'true'
        run: >-
          dotnet test tests/Moq.Analyzers.Test/Moq.Analyzers.Test.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Moq.Analyzers.Test.DiagnosticDescriptorMetadataTests|FullyQualifiedName~Moq.Analyzers.Test.PackageTests"

      - name: Upload binlogs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-build == 'true' && (success() || failure())
        with:
          name: binlogs
          path: ./artifacts/logs
          retention-days: 7
          if-no-files-found: error

      - name: Upload SARIF files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-build == 'true' && (success() || failure())
        with:
          name: SARIF files
          path: ./artifacts/obj/**/*.sarif
          retention-days: 7

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-build == 'true'
        with:
          name: packages
          path: |
            ./artifacts/package
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-build == 'true' && (success() || failure())
        with:
          name: artifacts
          path: ./artifacts
          retention-days: 7
          if-no-files-found: error

      - name: Skip notice
        if: needs.check-paths.outputs.run-build != 'true'
        env:
          TIER: ${{ needs.check-paths.outputs.tier }}
        run: echo "Skipped for tier '$TIER'. See build/scripts/ci/classify-changed-paths.sh."

  # Run unit tests on multiple platforms. Each platform builds locally to ensure
  # platform-appropriate metadata (runtimeconfig.dev.json, project.assets.json)
  # is generated with correct local paths.
  test:
    needs: [check-paths]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      IS_CODACY_COVERAGE_ALLOWED: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
      IS_QLTY_COVERAGE_ALLOWED: ${{ secrets.QLTY_COVERAGE_TOKEN != '' }}
      IS_TARGET_MAIN: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-paths.outputs.run-tests == 'true'
        with:
          fetch-depth: 0

      - name: Setup, Restore, and Build Solution
        if: needs.check-paths.outputs.run-tests == 'true'
        uses: ./.github/actions/setup-restore-build

      - name: Restore Code Coverage history
        if: needs.check-paths.outputs.run-tests == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CoverageHistory-${{ matrix.os }}
          path: ./artifacts/TestResults/coveragehistory
        continue-on-error: true

      - name: Test
        if: needs.check-paths.outputs.run-tests == 'true'
        run: dotnet test --no-build --configuration Release --settings ./build/targets/tests/test.runsettings
        env:
          REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}

      - name: Upload coverage history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          needs.check-paths.outputs.run-tests == 'true'
          && success()
          && env.IS_TARGET_MAIN == 'true'
        with:
          name: CoverageHistory-${{ matrix.os }}
          path: ./artifacts/TestResults/coveragehistory
          retention-days: 7

      - name: Upload *.received.* files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-tests == 'true' && failure()
        with:
          name: verify-test-results-${{ matrix.os }}
          path: |
            **/*.received.*
          retention-days: 7

      - name: Upload Test Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-tests == 'true' && (success() || failure())
        with:
          name: .NET Test Reports (${{ matrix.os }})
          path: "artifacts/TestResults/**/*.trx"
          retention-days: 7
          if-no-files-found: error

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-tests == 'true' && (success() || failure())
        with:
          name: .NET Code Coverage Reports (${{ matrix.os }})
          path: "artifacts/TestResults/coverage/**"
          retention-days: 7

      - name: Publish coverage summary to GitHub
        if: needs.check-paths.outputs.run-tests == 'true'
        run: cat artifacts/TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload coverage data to Codacy
        if: >-
          needs.check-paths.outputs.run-tests == 'true'
          && runner.os == 'Linux'
          && env.IS_CODACY_COVERAGE_ALLOWED == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ github.workspace }}/artifacts/TestResults/coverage/Cobertura.xml

      # The docs-only and docs-tested tiers skip this job's tests, but
      # "Codacy Coverage Variation" is required and only posts after an
      # upload for the PR head. Coverage counts only Moq.Analyzers.dll,
      # Moq.CodeFixes.dll, and PerfDiff.dll, and neither tier changes their
      # inputs, so the base commit's coverage is this PR's coverage. Reuse
      # it from the main push run, which always runs the full pipeline.
      # Fail if missing; never post coverage that was not measured.
      - name: Download base branch coverage for Codacy
        id: base-coverage
        if: >-
          needs.check-paths.outputs.run-tests != 'true'
          && github.event_name == 'pull_request'
          && runner.os == 'Linux'
          && env.IS_CODACY_COVERAGE_ALLOWED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARTIFACT_NAME: .NET Code Coverage Reports (${{ matrix.os }})
          DOWNLOAD_DIR: ${{ runner.temp }}/base-coverage
        run: |
          runs_api="repos/$GH_REPO/actions/workflows/main.yml/runs?event=push&branch=main&status=success&per_page=1"
          # Only the base commit's own run measured this PR's code. Never fall
          # back to another commit's coverage.
          run_id="$(gh api "$runs_api&head_sha=$BASE_SHA" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main.yml push run for base $BASE_SHA yet. Wait for main CI on that commit to pass, then re-run this job."
            exit 1
          fi

          run_sha="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_sha')"
          echo "Using coverage from run $run_id (main at $run_sha)"
          if ! gh run download "$run_id" --name "$ARTIFACT_NAME" --dir "$DOWNLOAD_DIR"; then
            echo "::error::Could not download '$ARTIFACT_NAME' from run $run_id. It may have expired. Re-run main.yml on main, then re-run this job."
            exit 1
          fi

          report="$DOWNLOAD_DIR/Cobertura.xml"
          if [[ ! -s "$report" ]]; then
            echo "::error::'$ARTIFACT_NAME' from run $run_id has no Cobertura.xml."
            exit 1
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      # The action reads the PR head SHA from the event payload, so this
      # coverage is recorded against the PR head commit.
      - name: Upload base branch coverage to Codacy
        if: steps.base-coverage.outputs.report != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.base-coverage.outputs.report }}

      - name: Upload coverage data to Qlty
        if: >-
          needs.check-paths.outputs.run-tests == 'true'
          && runner.os == 'Linux'
          && env.IS_QLTY_COVERAGE_ALLOWED == 'true'
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: ${{ github.workspace }}/artifacts/TestResults/coverage/Cobertura.xml

      - name: Skip notice
        if: needs.check-paths.outputs.run-tests != 'true'
        env:
          TIER: ${{ needs.check-paths.outputs.tier }}
        run: echo "Skipped for tier '$TIER'. See build/scripts/ci/classify-changed-paths.sh."

  # Verify the shipped nupkg loads without CS8032 on every supported host.
  # This is the end-to-end integration test for issue #850.
  #
  # The analyzer targets netstandard2.0 because it must load in two hosts:
  #   1. dotnet CLI  - csc runs on .NET (8/9/10), tested on Linux ARM
  #   2. msbuild.exe - csc runs on .NET Framework (VS), tested on Windows x64
  analyzer-load-test:
    needs: [check-paths, build]
    timeout-minutes: 20
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # dotnet CLI compiler host (modern .NET runtime)
          - dotnet-version: '8.0.x'
            tfm: net8.0
            runs-on: ubuntu-24.04-arm
            build-engine: dotnet
          - dotnet-version: '9.0.x'
            tfm: net9.0
            runs-on: ubuntu-24.04-arm
            build-engine: dotnet
          - dotnet-version: '10.0.x'
            tfm: net10.0
            runs-on: ubuntu-24.04-arm
            build-engine: dotnet
          # MSBuild/.NET Framework compiler host - VS 2022 (GA)
          - dotnet-version: '8.0.x'
            tfm: net472
            runs-on: windows-2022
            build-engine: msbuild
          - dotnet-version: '8.0.x'
            tfm: net48
            runs-on: windows-2022
            build-engine: msbuild
          - dotnet-version: '8.0.x'
            tfm: net481
            runs-on: windows-2022
            build-engine: msbuild
          # MSBuild/.NET Framework compiler host - VS 2026 (beta)
          - dotnet-version: '8.0.x'
            tfm: net472
            runs-on: windows-2025-vs2026
            build-engine: msbuild
          - dotnet-version: '8.0.x'
            tfm: net48
            runs-on: windows-2025-vs2026
            build-engine: msbuild
          - dotnet-version: '8.0.x'
            tfm: net481
            runs-on: windows-2025-vs2026
            build-engine: msbuild

    steps:
      - name: Setup .NET ${{ matrix.dotnet-version }}
        if: needs.check-paths.outputs.run-tests == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Setup MSBuild
        if: needs.check-paths.outputs.run-tests == 'true' && matrix.build-engine == 'msbuild'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Download nupkg artifact
        if: needs.check-paths.outputs.run-tests == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ./local-feed

      - name: Create test project
        if: needs.check-paths.outputs.run-tests == 'true'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem ./local-feed -Recurse -Filter 'Moq.Analyzers.*.nupkg' |
                 Where-Object { $_.Name -notlike '*.symbols.*' } |
                 Select-Object -First 1
          if (-not $pkg) {
            Write-Error "Could not find Moq.Analyzers.*.nupkg (excluding symbols) in ./local-feed"
            exit 1
          }
          $version = $pkg.Name -replace '^Moq\.Analyzers\.' -replace '\.nupkg$'
          $feedDir = (Resolve-Path $pkg.DirectoryName).Path
          Write-Host "Testing Moq.Analyzers $version with ${{ matrix.build-engine }} / ${{ matrix.tfm }}"
          echo "ANALYZER_VERSION=$version" >> $env:GITHUB_ENV
          echo "FEED_DIR=$feedDir" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Path test-project | Out-Null

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feedDir" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content test-project/nuget.config

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Library</OutputType>
              <TargetFramework>${{ matrix.tfm }}</TargetFramework>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Moq.Analyzers" Version="$version" />
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          "@ | Set-Content test-project/TestAnalyzerLoad.csproj

          @"
          namespace TestAnalyzerLoad;
          public class Placeholder { }
          "@ | Set-Content test-project/Placeholder.cs

      - name: Build with dotnet CLI
        if: needs.check-paths.outputs.run-tests == 'true' && matrix.build-engine == 'dotnet'
        shell: pwsh
        working-directory: test-project
        run: |
          $output = dotnet build -v n 2>&1 | Out-String
          $buildExitCode = $LASTEXITCODE
          Write-Host $output

          if ($buildExitCode -ne 0) {
            Write-Host "::error::Build failed with exit code $buildExitCode (dotnet / ${{ matrix.tfm }})"
            exit $buildExitCode
          }

          if ($output -match 'CS8032') {
            Write-Host "::error::CS8032: analyzer failed to load (dotnet / ${{ matrix.tfm }}). See https://github.com/rjmurillo/moq.analyzers/issues/850"
            exit 1
          }
          if ($output -match '(?i)could not load file or assembly') {
            Write-Host "::error::Assembly binding failure (dotnet / ${{ matrix.tfm }}). See https://github.com/rjmurillo/moq.analyzers/issues/850"
            exit 1
          }

          Write-Host ""
          Write-Host "Analyzer loaded successfully (dotnet / ${{ matrix.tfm }})"

      - name: Build with MSBuild
        if: needs.check-paths.outputs.run-tests == 'true' && matrix.build-engine == 'msbuild'
        shell: pwsh
        working-directory: test-project
        run: |
          $output = msbuild TestAnalyzerLoad.csproj -restore -p:Configuration=Release -v:n 2>&1 | Out-String
          $buildExitCode = $LASTEXITCODE
          Write-Host $output

          if ($buildExitCode -ne 0) {
            Write-Host "::error::Build failed with exit code $buildExitCode (msbuild / ${{ matrix.tfm }})"
            exit $buildExitCode
          }

          if ($output -match 'CS8032') {
            Write-Host "::error::CS8032: analyzer failed to load (msbuild / ${{ matrix.tfm }}). See https://github.com/rjmurillo/moq.analyzers/issues/850"
            exit 1
          }
          if ($output -match '(?i)could not load file or assembly') {
            Write-Host "::error::Assembly binding failure (msbuild / ${{ matrix.tfm }}). See https://github.com/rjmurillo/moq.analyzers/issues/850"
            exit 1
          }

          Write-Host ""
          Write-Host "Analyzer loaded successfully (msbuild / ${{ matrix.tfm }})"

      - name: Skip notice
        if: needs.check-paths.outputs.run-tests != 'true'
        env:
          TIER: ${{ needs.check-paths.outputs.tier }}
        run: echo "Skipped for tier '$TIER'. See build/scripts/ci/classify-changed-paths.sh."

  # Performance validation runs last, after build and tests confirm correctness.
  # Builds from source on Linux ARM to get consistent benchmark results.
  # The benchmarks load only src/Analyzers (with src/Common) and the test
  # helpers, so the full-no-perf tier skips the steps here.
  perf:
    needs: [check-paths, build, test]
    timeout-minutes: 60
    runs-on: ubuntu-26.04-arm

    env:
      RUN_FULL_PERF: ${{ (github.event_name == 'schedule'  && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance == 'true') }}
      FORCE_PERF_BASELINE: ${{ github.event.inputs.force_baseline }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-paths.outputs.run-perf == 'true'
        with:
          fetch-depth: 0

      - name: Setup, Restore, and Build Solution
        if: needs.check-paths.outputs.run-perf == 'true'
        uses: ./.github/actions/setup-restore-build

      - name: Get baseline SHA
        if: needs.check-paths.outputs.run-perf == 'true'
        id: get-baseline-sha
        run: |
          if (-not (Test-Path build/perf/baseline.json)) {
            Write-Error "baseline.json not found - aborting performance job."
            exit 1
          }
          $baseline = Get-Content build/perf/baseline.json | ConvertFrom-Json
          echo "sha=$($baseline.sha)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # The baseline SHA may require a different .NET SDK version
      - name: Checkout baseline
        if: needs.check-paths.outputs.run-perf == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.get-baseline-sha.outputs.sha }}
          fetch-depth: 0

      - name: Setup .NET for performance baseline
        if: needs.check-paths.outputs.run-perf == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: ./global.json

      - name: Restore checkout
        if: needs.check-paths.outputs.run-perf == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get performance test filter
        if: needs.check-paths.outputs.run-perf == 'true'
        id: get-perf-filter
        run: |
          if ('${{ env.RUN_FULL_PERF }}' -eq 'true') {
            echo "filter='*'" >> $env:GITHUB_OUTPUT
          } else {
            echo "filter='*(FileCount: 1)'" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Validate performance
        if: needs.check-paths.outputs.run-perf == 'true'
        shell: pwsh
        run: ${{ github.workspace }}/build/scripts/perf/PerfCore.ps1 -v diag -diff -ci -filter ${{ steps.get-perf-filter.outputs.filter }}

      - name: Publish baseline performance summaries to GitHub
        if: needs.check-paths.outputs.run-perf == 'true' && (success() || failure())
        shell: pwsh
        run: |
          $resultsDir = "artifacts/performance/perfResults/baseline/results"
          if (Test-Path $resultsDir) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Baseline Performance Results"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Baseline SHA: ${{ steps.get-baseline-sha.outputs.sha }}"
            $files = Get-ChildItem -Path $resultsDir -Filter "*-report-github.md" | Sort-Object Name
            foreach ($file in $files) {
              Get-Content $file.FullName | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "---"
          }

      - name: Publish performance summaries to GitHub
        if: needs.check-paths.outputs.run-perf == 'true' && (success() || failure())
        shell: pwsh
        run: |
          $resultsDir = "artifacts/performance/perfResults/perfTest/results"
          if (Test-Path $resultsDir) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Current Performance Results"
            $files = Get-ChildItem -Path $resultsDir -Filter "*-report-github.md" | Sort-Object Name
            foreach ($file in $files) {
              Get-Content $file.FullName | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "---"
          }

      - name: Upload performance files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-paths.outputs.run-perf == 'true' && (success() || failure())
        with:
          name: performance
          path: |
            ./artifacts/performance/**
          retention-days: 7

      - name: Skip notice
        if: needs.check-paths.outputs.run-perf != 'true'
        env:
          TIER: ${{ needs.check-paths.outputs.tier }}
        run: echo "Skipped for tier '$TIER'. See build/scripts/ci/classify-changed-paths.sh."
